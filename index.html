<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雅思词汇复习 · 新词 / Test / 错题集</title>
<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#262019;--muted:#8a8071;--accent:#b3551f;--line:#e6dfd0;--ok:#3a7d44;--err:#b03a2e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,"Noto Serif SC","Songti SC",serif;background:var(--bg);color:var(--ink);max-width:640px;margin:0 auto;padding:20px 16px 90px;line-height:1.65;font-size:16px;-webkit-font-smoothing:antialiased}
header{padding:12px 4px 8px}h1{font-size:26px;letter-spacing:.5px}.sub{color:var(--muted);font-size:13px;margin-top:2px}
.tabs{display:flex;gap:8px;margin:14px 0 18px}
.tab-btn{flex:1;padding:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);font-family:inherit;font-size:15px;color:var(--ink);cursor:pointer;transition:all .15s}
.tab-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab-btn .cnt{display:block;font-size:12px;opacity:.7;margin-top:2px}
.panel{display:none}.panel.active{display:block}
.batch{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.batch-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.batch-head .date{font-size:14px;font-weight:bold}.batch-head .meta{font-size:12px;color:var(--muted);flex:1}
.batch-head .arrow{color:var(--muted);font-size:12px;transition:transform .15s}
.batch.open .batch-head .arrow{transform:rotate(180deg)}
.batch-body{display:none;border-top:1px solid var(--line)}.batch.open .batch-body{display:block}
.w-row{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:15px}
.w-row:last-child{border-bottom:none}.w-row .w{font-weight:bold;min-width:120px;font-size:16px}
.w-row .w .ph{display:block;font-size:12px;color:var(--muted);font-weight:normal}
.w-row .w .mn{display:block;font-size:12px;color:var(--muted);font-weight:normal;margin-top:2px}
.w-row .def{flex:1}.w-row .def .ex{font-size:12.5px;color:#5a5144;font-style:italic;margin-top:3px;display:block}
.test-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 20px;text-align:center}
.test-progress{font-size:13px;color:var(--muted);margin-bottom:6px}
.test-word{font-size:34px;font-weight:bold;letter-spacing:1px;margin:16px 0 4px}
.test-ph{font-size:15px;color:var(--muted);margin-bottom:20px}
.test-detail{display:none;text-align:left;background:var(--bg);border-radius:10px;padding:14px 16px;margin:8px 0 18px}
.test-detail.show{display:block}.test-detail .lbl{color:var(--muted);font-size:12.5px;margin-right:6px}
.test-detail div{margin:5px 0;font-size:15px}
.test-btns{display:flex;gap:8px;margin-top:8px}
.tbtn{flex:1;padding:11px 0;border-radius:10px;border:1px solid var(--line);background:#fff;font-family:inherit;font-size:14px;cursor:pointer}
.tbtn.got{color:var(--ok);border-color:var(--ok)}.tbtn.miss{color:var(--err);border-color:var(--err)}.tbtn.reveal{color:var(--accent);border-color:var(--accent)}
.tbtn:disabled{opacity:.4;cursor:default}
.test-empty{padding:40px 20px;text-align:center;color:var(--muted)}.test-empty b{display:block;font-size:20px;color:var(--ink);margin-bottom:6px}
.test-done{font-size:15px;padding:10px 0}
.err-count{background:var(--card);border-left:4px solid var(--accent);border-radius:8px;padding:10px 16px;margin-bottom:14px;font-size:15px}
.err-count b{color:var(--accent);font-size:19px}
.e-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px}
.e-row input[type=checkbox]{width:19px;height:19px;accent-color:var(--ok);cursor:pointer;flex-shrink:0}
.e-word{font-size:18px;font-weight:bold;flex:1}
.e-expand{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 12px;font-family:inherit;font-size:13px;color:#555;cursor:pointer}
.e-detail{display:none;background:var(--card);border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;padding:4px 14px 14px;margin:-8px 0 8px;color:#444;font-size:15px}
.e-detail.show{display:block}.e-detail .lbl{color:var(--muted);font-size:12.5px;margin-right:6px}.e-detail div{margin:5px 0}
.err-empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:15px;border:2px dashed var(--line);border-radius:14px}
.mini-btn{display:inline-block;margin-left:8px;padding:3px 12px;font-size:12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;vertical-align:middle}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.foot{margin-top:26px;font-size:12px;color:var(--muted);text-align:center;line-height:1.8}
</style>
</head>
<body>
<header><h1>📚 雅思词汇复习</h1><p class="sub">每天 20:00 新词入库 · 每天 10:00 Test 昨日新词 · 错词自动进错题集</p></header>
<nav class="tabs">
<button class="tab-btn active" data-panel="new">📖 新词<span class="cnt" id="cnt-new"></span></button>
<button class="tab-btn" data-panel="test">📝 Test<span class="cnt" id="cnt-test"></span></button>
<button class="tab-btn" data-panel="err">📕 错题集<span class="cnt" id="cnt-err"></span></button>
</nav>
<section id="panel-new" class="panel active"><div id="batch-list"></div></section>
<section id="panel-test" class="panel"><div id="test-box" class="test-box"></div></section>
<section id="panel-err" class="panel">
<div class="err-count">错题集当前共 <b id="err-num">0</b> 个词
<button class="mini-btn" onclick="exportData()">导出备份</button>
<button class="mini-btn" onclick="document.getElementById('import-file').click()">导入恢复</button>
<input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
</div>
<div id="err-list"></div>
<div class="err-empty" id="err-empty" style="display:none">暂无错词，继续保持 💪</div>
</section>
<div class="foot">学习状态存在浏览器本地（localStorage），刷新不丢；清浏览器缓存会重置。<br>每晚 20:00 推送的新词由助手自动写入本文件词库；Test 中没记住的词自动进入错题集。</div>
<script>
const BATCHES=[
{id:"hist-01",date:"第 1 批",testable:false,words:[
{word:"ubiquitous",phonetic:"/juːˈbɪkwɪtəs/",meaning:"无处不在的",mnemonic:"优步(Uber)到处跑"},
{word:"mitigate",phonetic:"/ˈmɪtɪɡeɪt/",meaning:"缓解，减轻",mnemonic:"灾难缩到迷你"},
{word:"pivotal",phonetic:"/ˈpɪvətəl/",meaning:"关键性的",mnemonic:"门轴(pivot)级关键"},
{word:"sustainable",phonetic:"/səˈsteɪnəbl/",meaning:"可持续的",mnemonic:"撑得住＝可持续"},
{word:"deteriorate",phonetic:"/dɪˈtɪəriəreɪt/",meaning:"恶化，变差",mnemonic:"往地底掉"},
{word:"scrutinize",phonetic:"/ˈskruːtənaɪz/",meaning:"仔细审查",mnemonic:"死抠着查"},
{word:"inevitable",phonetic:"/ɪnˈevɪtəbl/",meaning:"不可避免的",mnemonic:"避不开的"},
{word:"affluent",phonetic:"/ˈæfluənt/",meaning:"富裕的",mnemonic:"钱如流水"},
{word:"exacerbate",phonetic:"/ɪɡˈzæsəbeɪt/",meaning:"使恶化，加剧",mnemonic:"弄得更尖锐(acerb)"},
{word:"paradigm",phonetic:"/ˈpærədaɪm/",meaning:"范式，模式",mnemonic:"放旁边给人看的示范"}]}];
const LS_WRONG='ielts_wrong',LS_TESTED='ielts_tested';
function lsLoad(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function lsSave(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function getWrong(){return lsLoad(LS_WRONG,[])}
function addWrong(w){const a=getWrong();if(!a.includes(w)){a.push(w);lsSave(LS_WRONG,a)}}
function removeWrong(w){lsSave(LS_WRONG,getWrong().filter(x=>x!==w))}
function getTested(){return lsLoad(LS_TESTED,[])}
function markTested(id){const t=getTested();if(!t.includes(id)){t.push(id);lsSave(LS_TESTED,t)}}
function getNextTestBatch(){const t=getTested();for(let i=BATCHES.length-1;i>=0;i--){const b=BATCHES[i];if(b.testable&&!t.includes(b.id))return b}return null}
function findWord(w){for(const b of BATCHES)for(const x of b.words)if(x.word===w)return x;return null}
function allWords(){const o=[];for(const b of BATCHES)o.push(...b.words);return o}
window.IELTSApp={BATCHES,getWrong,addWrong,removeWrong,getTested,markTested,getNextTestBatch,findWord,allWords,lsLoad,lsSave};
function exportData(){const d={wrong:getWrong(),tested:getTested(),exportedAt:new Date().toISOString()};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ielts-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(e){try{const d=JSON.parse(e.target.result);let aw=0,at=0;if(Array.isArray(d.wrong))d.wrong.forEach(w=>{if(!getWrong().includes(w)){addWrong(w);aw++}});if(Array.isArray(d.tested))d.tested.forEach(t=>{if(!getTested().includes(t)){markTested(t);at++}});renderErrors();renderTest();alert('导入成功：合并错词 +'+aw+' 个，已测批次 +'+at+' 个\n当前错词共 '+getWrong().length+' 个')}catch(err){alert('导入失败：文件格式不对')}};r.readAsText(f);ev.target.value=''}
const $=id=>document.getElementById(id);
let testBatch=null,testIdx=0,testRevealed=false,testResult=null,testDone=false;
function switchTab(n){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.panel===n));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+n));if(n==='new')renderBatches();if(n==='test')renderTest();if(n==='err')renderErrors()}
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>switchTab(b.dataset.panel));
function updateCounts(){const e=getWrong().length;$('cnt-new').textContent=allWords().length+' 词';$('cnt-err').textContent=e+' 词';const nb=getNextTestBatch();$('cnt-test').textContent=nb?nb.words.length+' 词待测':'无';$('err-num').textContent=e;$('err-empty').style.display=e?'none':'block'}
function renderBatches(){const box=$('batch-list');box.innerHTML='';for(let i=BATCHES.length-1;i>=0;i--){const b=BATCHES[i];const d=document.createElement('div');d.className='batch'+(i===BATCHES.length-1?' open':'');let rows='';for(const w of b.words){rows+='<div class="w-row"><div class="w">'+esc(w.word)+'<span class="ph">'+esc(w.phonetic||'')+'</span>'+(w.mnemonic?'<span class="mn">💡 '+esc(w.mnemonic)+'</span>':'')+'</div><div class="def">'+esc(w.meaning)+(w.example?'<span class="ex">'+esc(w.example)+'</span>':'')+'</div></div>'}d.innerHTML='<div class="batch-head"><span class="date">'+esc(b.date)+(b.testable?' · 新':'')+'</span><span class="meta">'+b.words.length+' 词</span><span class="arrow">▼</span></div><div class="batch-body">'+rows+'</div>';d.querySelector('.batch-head').onclick=()=>d.classList.toggle('open');box.appendChild(d)}}
function renderTest(){const box=$('test-box');const nb=getNextTestBatch();if(!nb){box.innerHTML='<div class="test-empty"><b>暂无待测批次</b>今晚 20:00 推送新词后，明天上午即可在这里测试。</div>';updateCounts();return}testBatch=nb;testIdx=0;testRevealed=false;testResult=null;testDone=false;drawTestCard()}
function drawTestCard(){const box=$('test-box');const b=testBatch;const w=b.words[testIdx];if(testDone){box.innerHTML='<div class="test-done">✅ 今日 Test 完成：共 '+b.words.length+' 词，<span style="color:var(--err)">'+testResult.miss+' 个进入错题集</span>。<br><br><button class="tbtn reveal" onclick="switchTab(&quot;err&quot;)">去错题集看看</button> <button class="tbtn got" onclick="renderTest()">再测一遍</button></div>';updateCounts();return}box.innerHTML='<div class="test-progress">第 '+(testIdx+1)+' / '+b.words.length+' 词 · 批次 '+esc(b.date)+'</div><div class="test-word">'+esc(w.word)+'</div>'+(testRevealed?'<div class="test-ph">'+esc(w.phonetic||'')+'</div>':'<div class="test-ph">看英文，想中文</div>')+'<div class="test-detail'+(testRevealed?' show':'')+'"><div><span class="lbl">音标</span>'+esc(w.phonetic||'')+'</div><div><span class="lbl">词义</span>'+esc(w.meaning)+'</div><div><span class="lbl">例句</span>'+esc(w.example||w.mnemonic||'')+'</div></div>'+(testRevealed?'<div class="test-btns"><button class="tbtn got" onclick="testAnswer(true)">记住了</button><button class="tbtn miss" onclick="testAnswer(false)">还是没记住</button></div>':'<div class="test-btns"><button class="tbtn got" onclick="testAnswer(true)">想出来了</button><button class="tbtn miss" onclick="testAnswer(false)">没记住</button><button class="tbtn reveal" onclick="testReveal()">显示答案</button></div>')}
function testReveal(){testRevealed=true;drawTestCard()}
function testAnswer(got){const b=testBatch,w=b.words[testIdx];if(!got)addWrong(w.word);testResult=testResult||{miss:0};if(!got)testResult.miss++;testIdx++;if(testIdx>=b.words.length){testDone=true;markTested(b.id);drawTestCard()}else{testRevealed=false;drawTestCard()}}
function renderErrors(){const list=$('err-list');list.innerHTML='';const wrong=getWrong();for(const word of wrong){const w=findWord(word);if(!w)continue;const row=document.createElement('div');row.innerHTML='<div class="e-row"><input type="checkbox" data-word="'+esc(w.word)+'"><span class="e-word">'+esc(w.word)+'</span><button class="e-expand">展开 ▾</button></div><div class="e-detail"><div><span class="lbl">音标</span>'+esc(w.phonetic||'')+'</div><div><span class="lbl">词义</span>'+esc(w.meaning)+'</div><div><span class="lbl">例句</span>'+esc(w.example||w.mnemonic||'')+'</div></div>';row.querySelector('input').onchange=function(){removeWrong(w.word);renderErrors();updateCounts()};row.querySelector('.e-expand').onclick=function(){const d=row.querySelector('.e-detail');d.classList.toggle('show');this.textContent=d.classList.contains('show')?'收起 ▴':'展开 ▾'};list.appendChild(row)}updateCounts()}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
renderBatches();renderTest();renderErrors();
</script>
</body>
</html>
